<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0f1115">
<title>LLM Chat</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
  <header id="topbar">
    <button class="icon-btn" id="btn-menu" aria-label="会话">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
    </button>
    <div id="title-wrap">
      <div id="title">新会话</div>
      <div id="subtitle">未配置</div>
    </div>
    <button class="icon-btn" id="btn-new" aria-label="新建">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
    </button>
    <button class="icon-btn" id="btn-settings" aria-label="设置">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z" stroke="currentColor" stroke-width="1.7" fill="none"/><path d="M19.4 13a7.9 7.9 0 0 0 .05-2l1.6-1.2-1.9-3.3-1.9.8a7.9 7.9 0 0 0-1.7-1L15.2 4h-3.9l-.4 2.1a7.9 7.9 0 0 0-1.7 1l-1.9-.8L5.4 9.6 7 10.9a7.9 7.9 0 0 0 0 2l-1.6 1.2 1.9 3.3 1.9-.8c.5.4 1.1.7 1.7 1l.4 2.1h3.9l.4-2.1c.6-.25 1.2-.58 1.7-1l1.9.8 1.9-3.3z" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linejoin="round"/></svg>
    </button>
  </header>

  <main id="messages"></main>

  <footer id="composer">
    <div id="attach-row" class="attach-row" hidden></div>
    <div class="input-row">
      <textarea id="input" rows="1" placeholder="在这里输入你的问题…" enterkeyhint="enter"></textarea>
      <button class="send" id="btn-send" aria-label="发送">
        <svg viewBox="0 0 24 24" width="19" height="19"><path d="M12 19V5M6 11l6-6 6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="toolbar">
      <button class="tb-btn" id="btn-img" aria-label="图片">
        <svg viewBox="0 0 24 24" width="20" height="20"><rect x="3.5" y="4.5" width="17" height="15" rx="3" stroke="currentColor" stroke-width="1.6" fill="none"/><circle cx="9" cy="10" r="1.6" fill="currentColor"/><path d="M4.5 17l4.5-4.2 3.2 2.9 3-2.6 4.3 4.4" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="tb-btn" id="btn-sticker" aria-label="表情包">
        <svg viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="8.4" stroke="currentColor" stroke-width="1.6" fill="none"/><circle cx="9" cy="10.2" r="1.15" fill="currentColor"/><circle cx="15" cy="10.2" r="1.15" fill="currentColor"/><path d="M8.4 14.2c1 1.4 2.2 2.1 3.6 2.1s2.6-.7 3.6-2.1" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
      </button>
      <button class="tb-btn" id="btn-web" aria-label="联网搜索">
        <svg viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="8.3" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M3.7 12h16.6M12 3.7c2.4 2.3 3.6 5.1 3.6 8.3s-1.2 6-3.6 8.3c-2.4-2.3-3.6-5.1-3.6-8.3S9.6 6 12 3.7z" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
      </button>
      <button class="tb-btn" id="btn-params" aria-label="对话参数">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 7h10M18 7h2M4 12h4M12 12h8M4 17h9M17 17h3" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/><circle cx="16" cy="7" r="1.8" stroke="currentColor" stroke-width="1.5" fill="none"/><circle cx="10" cy="12" r="1.8" stroke="currentColor" stroke-width="1.5" fill="none"/><circle cx="15" cy="17" r="1.8" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
      </button>
      <div class="spacer"></div>
      <button class="model-chip" id="btn-model">
        <span id="model-name">选择模型</span>
        <svg viewBox="0 0 24 24" width="14" height="14"><path d="M8 10l4-4 4 4M8 14l4 4 4-4" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </footer>
</div>

<div id="scrim" class="scrim"></div>

<aside id="drawer" class="drawer">
  <div class="drawer-head">
    <img class="dh-avatar" src="avatar-ai.webp" alt="">
    <div class="dh-text">
      <div class="brand">语见</div>
      <div class="dh-sub" id="session-count">0 个会话</div>
    </div>
  </div>
  <div class="drawer-new">
    <button class="btn primary block" id="btn-drawer-new">＋ 新建对话</button>
  </div>
  <div id="session-list" class="session-list"></div>
  <div class="drawer-foot">
    <button class="btn ghost" id="btn-export-all">导出全部</button>
    <button class="btn ghost" id="btn-import">导入</button>
  </div>
</aside>

<section id="page-settings" class="page">
  <header class="page-head">
    <button class="icon-btn" id="btn-settings-back" aria-label="返回">
      <svg viewBox="0 0 24 24" width="21" height="21"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="page-title">设置</div>
    <div style="width:40px"></div>
  </header>
  <div id="settings-body" class="page-body"></div>
</section>

<section id="sheet" class="sheet">
  <div class="sheet-handle"></div>
  <div id="sheet-body" class="sheet-body"></div>
</section>

<div id="toast" class="toast"></div>

<script src="app.js"></script>
</body>
</html>
